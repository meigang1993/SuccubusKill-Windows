name: w-diff
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: probe
        run: |
          exec > /tmp/log.txt 2>&1
          set -x
          npm install --no-save @electron/asar 2>&1 | tail -2
          ASAR=./node_modules/.bin/asar
          $ASAR list resources/app.asar > /tmp/list.txt
          echo "ASAR_TOTAL: $(wc -l < /tmp/list.txt)"
          echo "ROOT_DIRS:"; sed 's#^/##' /tmp/list.txt | cut -d/ -f1 | sort -u | head -20
          $ASAR extract resources/app.asar /tmp/ext
          echo "EXT_ROOT:"; ls -la /tmp/ext
          echo "GAMEBUILD_OLD:"; grep -rho 'name="game-build" content="[^"]*"' /tmp/ext/game/index.html 2>/dev/null | head -2
          echo "ASAR_GAME_PKG:"; ls /tmp/ext/game | head -30
          echo "--- clone source ---"
          git clone --depth 1 -b "魅魔杀" https://github.com/meigang1993/- /tmp/src 2>&1 | tail -3
          echo "SRC_TOP:"; ls /tmp/src | head -20
          echo "PUBLISH_COUNT: $(find /tmp/src/publish -type f 2>/dev/null | wc -l)"
          echo "GAME_COUNT: $(find /tmp/ext/game -type f 2>/dev/null | wc -l)"
          echo "--- diff summary ---"
          diff -rq /tmp/ext/game /tmp/src/publish > /tmp/d.txt 2>&1
          echo "DIFF_LINES: $(wc -l < /tmp/d.txt)"
          echo "ONLY_IN_OLD: $(grep -c '^Only in /tmp/ext/game' /tmp/d.txt)"
          echo "ONLY_IN_NEW: $(grep -c '^Only in /tmp/src/publish' /tmp/d.txt)"
          echo "CHANGED: $(grep -c 'differ$' /tmp/d.txt)"
          echo "--- sample 30 ---"
          head -30 /tmp/d.txt
      - name: publish
        if: always()
        run: |
          git config user.name wbot
          git config user.email w@bot.local
          git checkout -B wdiff-log
          mkdir -p _recon
          cp /tmp/log.txt _recon/diff_log.txt 2>/dev/null || echo "no log" > _recon/diff_log.txt
          cp /tmp/d.txt _recon/diff_full.txt 2>/dev/null || true
          cp /tmp/list.txt _recon/asar_list.txt 2>/dev/null || true
          git add -A _recon
          git commit -m "wdiff log" || echo none
          git push -f origin wdiff-log
