name: Export ASAR Parts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch only app.asar via LFS
        run: |
          git lfs install
          git lfs pull --include="resources/app.asar"
          cd resources
          ls -l app.asar
          file app.asar
      - name: Split and report
        run: |
          cd resources
          SHA=$(sha256sum app.asar | cut -d' ' -f1)
          SIZE=$(stat -c%s app.asar)
          echo "$SHA" > /tmp/ORIG_SHA256.txt
          echo "orig_sha256=$SHA" >> /tmp/meta.txt
          echo "orig_size=$SIZE" >> /tmp/meta.txt
          rm -rf /tmp/parts && mkdir -p /tmp/parts
          split -b 8000000 -d -a 2 app.asar /tmp/parts/app_asar_part_
          NP=$(ls /tmp/parts | wc -l)
          echo "parts=$NP" >> /tmp/meta.txt
          ls -l /tmp/parts
          cat /tmp/meta.txt
      - name: Push parts to orphan branch
        run: |
          git config user.name "export-bot"
          git config user.email "bot@example.com"
          git checkout --orphan asar-parts
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf .github resources locales
          rm -f .gitattributes LICENSE LICENSES.chromium.html README.md \
                SuccubusKill.exe chrome_100_percent.pak chrome_200_percent.pak \
                d3dcompiler_47.dll dxcompiler.dll dxil.dll ffmpeg.dll icudtl.dat \
                libEGL.dll libGLESv2.dll resources.pak snapshot_blob.bin \
                v8_context_snapshot.bin version vk_swiftshader.dll \
                vk_swiftshader_icd.json vulkan-1.dll 2>/dev/null || true
          cp /tmp/parts/app_asar_part_* .
          cp /tmp/ORIG_SHA256.txt .
          cp /tmp/meta.txt .
          git add -f app_asar_part_* ORIG_SHA256.txt meta.txt
          git commit -m "asar parts export"
          git push -f origin asar-parts
      - name: Verify uploaded parts
        run: |
          git fetch origin asar-parts
          git ls-tree -r --long origin/asar-parts | awk '{print $4, $5}' | sort -k2
