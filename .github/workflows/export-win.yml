name: Export Full Win Build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Run export
        id: exp
        continue-on-error: true
        run: |
          set -x
          exec > /tmp/run.log 2>&1
          git lfs install
          git lfs pull
          du -sh .
          ls -l
          rm -rf .git .github
          zip -9 -r -q /tmp/win.zip . || echo "ZIP_FAILED"
          ls -l /tmp/win.zip || true
          SZ=$(stat -c%s /tmp/win.zip 2>/dev/null || echo 0)
          SHA=$(sha256sum /tmp/win.zip 2>/dev/null | cut -d' ' -f1 || echo none)
          rm -rf /tmp/wparts && mkdir -p /tmp/wparts
          split -b 8000000 -d -a 2 /tmp/win.zip /tmp/wparts/win_part_ || echo "SPLIT_FAILED"
          NP=$(ls /tmp/wparts | wc -l)
          printf 'zipsize=%s\nparts=%s\nsha256=%s\n' "$SZ" "$NP" "$SHA" > /tmp/wmeta.txt
          cat /tmp/wmeta.txt
      - name: Push result always
        if: always()
        run: |
          git config user.name "export-bot"
          git config user.email "bot@example.com"
          git checkout --orphan win-parts 2>/dev/null || true
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/wmeta.txt ./wmeta.txt 2>/dev/null || echo "NO_META" > wmeta.txt
          cp /tmp/run.log ./run.log 2>/dev/null || echo "NO_LOG" > run.log
          cp /tmp/wparts/win_part_* . 2>/dev/null || true
          ls -l
          git add -f . || echo "ADD_FAILED"
          git commit -m "win parts export" || echo "COMMIT_FAILED"
          git push -f origin win-parts || {
            echo "PUSH_FAILED - fallback to main"
            git fetch origin main
            git checkout -f main
            { echo "=== WMETA ==="; cat /tmp/wmeta.txt 2>/dev/null;
              echo "=== DISK ==="; df -h /tmp | tail -1;
              echo "=== ZIP ==="; ls -l /tmp/win.zip 2>/dev/null || echo "no zip";
              echo "=== PARTS ==="; ls -l /tmp/wparts 2>/dev/null | head -30;
              echo "=== LOG TAIL ==="; tail -60 /tmp/run.log 2>/dev/null; } > export-fail.log
            git add -f export-fail.log
            git commit -m "export diagnosis log"
            git push origin main
          }
