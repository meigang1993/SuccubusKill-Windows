name: Tighten LFS Tracking
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      - name: Pull real LFS content
        run: git lfs install && git lfs pull

      - name: Write narrowed gitattributes
        run: echo '' | base64 -d > .gitattributes

      - name: Renormalise every path
        run: |
          git rm -r --cached . > /dev/null
          git add -A
          echo "===== check-attr result ====="
          git ls-files | while read -r f; do
            printf '[%s] %s\n' "$(git check-attr filter -- "$f" | sed 's/.*: //')" "$f"
          done

      - name: Verify no pointer leaked
        run: |
          bad=0
          while IFS= read -r f; do
            if [ -f "$f" ] && head -c 40 "$f" | grep -q git-lfs; then
              echo "STILL POINTER: $f"
              bad=1
            fi
          done < <(git ls-files)
          [ "$bad" = "0" ] && echo "clean: no pointer text remains"
          echo "===== sizes ====="
          find . -type f -not -path './.git/*' -printf '%10s  %p\n' | sort -k2

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 收紧 LFS 追踪范围到二进制后缀" -m "此前使用通配符 * 把 LICENSE / version / vk_swiftshader_icd.json 等纯文本也纳入 LFS，白占配额且网页端不可读。现仅对 exe/dll/asar/pak/dat/bin 启用 LFS。" || echo "nothing to commit"
          git push origin HEAD:main

      - name: Publish log
        if: always()
        run: |
          {
            echo "===== FINAL attrs ====="
            git ls-files | while read -r f; do
              printf '[%s] %s\n' "$(git check-attr filter -- "$f" | sed 's/.*: //')" "$f"
            done
            echo
            echo "===== lfs ls-files ====="
            git lfs ls-files
            echo
            echo "===== sizes ====="
            find . -type f -not -path './.git/*' -printf '%10s  %p\n' | sort -k2
          } 2>&1 | tee /tmp/lfs.log
          cd "$GITHUB_WORKSPACE"
          git checkout -B lfs-check
          mkdir -p .github
          cp /tmp/lfs.log .github/lfs.log
          git add -f .github/lfs.log
          git commit -m "chore: lfs tighten log" || exit 0
          git push -f origin lfs-check
