name: Tighten LFS Tracking
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
          fetch-depth: 0

      - name: Ensure real LFS content present
        run: |
          git lfs install
          git lfs pull
          echo "===== BEFORE ====="
          find . -type f -not -path './.git/*' -printf '%10s  %p\n' | sort -k2

      - name: Rewrite .gitattributes to binary-only LFS
        run: |
          cat > .gitattributes <<'EOF'
# Only real binaries go through Git LFS.
# Text / config / license files stay as plain blobs so the repo stays
# readable on the web, diff-able, and cheap to clone.
*.exe   filter=lfs diff=lfs merge=lfs -text
*.dll   filter=lfs diff=lfs merge=lfs -text
*.asar  filter=lfs diff=lfs merge=lfs -text
*.pak   filter=lfs diff=lfs merge=lfs -text
*.dat   filter=lfs diff=lfs merge=lfs -text
*.bin   filter=lfs diff=lfs merge=lfs -text
EOF
          cat .gitattributes

      - name: Re-normalise tracked files
        run: |
          # Force git to re-evaluate every path against the new attributes.
          git rm --cached -r . >/dev/null
          git add -A
          echo "===== RESULT ====="
          git lfs ls-files
          echo "---- non-lfs (plain blob) files ----"
          git ls-files | while read -r f; do
            attr=$(git check-attr filter -- "$f" | sed 's/.*: //')
            [ "$attr" = "lfs" ] || echo "  plain: $f"
          done

      - name: Verify no pointer leaked into worktree
        run: |
          bad=0
          while IFS= read -r f; do
            if [ -f "$f" ] && head -c 40 "$f" | grep -q git-lfs; then
              echo "STILL POINTER: $f"; bad=1
            fi
          done < <(git ls-files)
          [ "$bad" = "0" ] && echo "worktree clean: no pointer text in files"
          echo "===== AFTER ====="
          find . -type f -not -path './.git/*' -printf '%10s  %p\n' | sort -k2 | head -40

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 收紧 LFS 追踪范围到二进制后缀

此前 .gitattributes 使用通配符 * ，把 LICENSE / LICENSES.chromium.html /
version / vk_swiftshader_icd.json / README.md 等纯文本文件也纳入 LFS，
既白占 LFS 配额，又让这些文件在网页端不可读、不可 diff。

现改为仅对 exe / dll / asar / pak / dat / bin 启用 LFS，
文本文件恢复为普通 blob。" || echo "nothing to commit"
          git push origin HEAD:main

      - name: Publish log
        if: always()
        run: |
          {
            echo "===== FINAL git ls-files (attr) ====="
            git ls-files | while read -r f; do
              attr=$(git check-attr filter -- "$f" | sed 's/.*: //')
              echo "  [$attr] $f"
            done
            echo
            echo "===== lfs ls-files ====="
            git lfs ls-files
            echo
            echo "===== sizes ====="
            find . -type f -not -path './.git/*' -printf '%10s  %p\n' | sort -k2
          } 2>&1 | tee /tmp/lfs.log
          cd "$GITHUB_WORKSPACE"
          git checkout -B lfs-check
          mkdir -p .github
          cp /tmp/lfs.log .github/lfs.log
          git add -f .github/lfs.log
          git commit -m "chore: lfs tighten log" || exit 0
          git push -f origin lfs-check
