name: LFS Object Probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false, persist-credentials: true }

      - name: Probe LFS batch API for the exe
        run: |
          {
            echo "===== PROBE LEGACY REPO (meigang1993/-) ====="
            curl -s -X POST "https://github.com/meigang1993/-.git/info/lfs/objects/batch" \
              -H "Accept: application/vnd.git-lfs+json" \
              -H "Content-Type: application/vnd.git-lfs+json" \
              -d '{"operation":"download","transfers":["basic"],"objects":[{"oid":"beedf4633197174515fde125b7123332ac7fc132f43509b4971c856a2625f54b","size":225442304}],"ref":{"name":"refs/heads/main"}}' \
              -w "\n[http=%{http_code}]\n"
            echo
            echo "===== PROBE NEW REPO (SuccubusKill-Windows) ====="
            curl -s -X POST "https://github.com/meigang1993/SuccubusKill-Windows.git/info/lfs/objects/batch" \
              -H "Accept: application/vnd.git-lfs+json" \
              -H "Content-Type: application/vnd.git-lfs+json" \
              -d '{"operation":"download","transfers":["basic"],"objects":[{"oid":"beedf4633197174515fde125b7123332ac7fc132f43509b4971c856a2625f54b","size":225442304}],"ref":{"name":"refs/heads/main"}}' \
              -w "\n[http=%{http_code}]\n"
            echo
            echo "===== QUOTA: list LFS objects in new repo (auth) ====="
            gh api "repos/meigang1993/SuccubusKill-Windows/contents/?ref=main" --paginate -q '.[].name' 2>&1 | head -30
          } 2>&1 | tee /tmp/probe.log

      - name: Publish probe log
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B import-diag
          mkdir -p .github
          cp /tmp/probe.log .github/probe.log
          git add -f .github/probe.log
          git commit -m "probe: lfs object existence" || exit 0
          git push -f origin import-diag
