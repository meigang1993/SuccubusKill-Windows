name: w-recon
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: probe
        run: |
          exec > /tmp/log.txt 2>&1
          set -x
          pwd; ls -la
          ls -la resources/ | head -20
          echo "--- asar head ---"
          head -c 200 resources/app.asar
          echo
          echo "--- node/npm ---"
          node -v; npm -v
          npm install --no-save @electron/asar 2>&1 | tail -3
          ls node_modules/.bin/ 2>/dev/null | head
          ASAR=./node_modules/@electron/asar/bin/asar.js
          ls -la $ASAR
          echo "--- list ---"
          node $ASAR list resources/app.asar > /tmp/list.txt
          echo "TOTAL: $(wc -l < /tmp/list.txt)"
          head -80 /tmp/list.txt
          echo "--- extract ---"
          node $ASAR extract resources/app.asar /tmp/ext
          echo "TOPLEVEL:"; ls /tmp/ext | head -40
          echo "INDEX:"; find /tmp/ext -maxdepth 3 -name index.html | head
          echo "GAMEBUILD:"; grep -rho 'name="game-build" content="[^"]*"' /tmp/ext --include=index.html 2>/dev/null | head -3
          echo "PKG:"; head -c 500 /tmp/ext/package.json 2>/dev/null
          echo "BUNDLES:"; ls /tmp/ext/bundles 2>/dev/null | head -20
      - name: publish log
        if: always()
        run: |
          git config user.name recon-bot
          git config user.email recon@bot.local
          git checkout -B recon-log
          mkdir -p _recon
          cp /tmp/log.txt _recon/log.txt 2>/dev/null || echo "no log" > _recon/log.txt
          cp /tmp/list.txt _recon/asar_list.txt 2>/dev/null || echo "no list" > _recon/asar_list.txt
          git add -A _recon
          git commit -m "recon log" || echo "nothing to commit"
          git push -f origin recon-log
