name: Import Windows Build LFS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true

      - name: Pull real binaries from legacy public repo
        run: |
          set -e
          git lfs install
          echo "== clone legacy repo (public) =="
          git clone -b "魅魔杀" https://github.com/meigang1993/- /tmp/oldrepo
          cd /tmp/oldrepo
          echo "== git lfs pull =="
          git lfs pull
          echo "== verify real size =="
          ls -lh Windows版/SuccubusKill.exe
          sz=$(stat -c%s Windows版/SuccubusKill.exe)
          echo "real_size=$sz"
          if [ "$sz" -lt 100000000 ]; then
            echo "FATAL: LFS pull failed, still a pointer"; exit 1
          fi

      - name: Copy binaries into workspace
        run: |
          set -e
          cp -r /tmp/oldrepo/Windows版/. "$GITHUB_WORKSPACE"/
          ls -lh "$GITHUB_WORKSPACE"/SuccubusKill.exe

      - name: Commit and push LFS objects
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -40
          git commit -m "chore: import Windows build with real LFS objects" || echo "nothing to commit"
          git push origin HEAD:main
          echo "== git lfs push --all =="
          git lfs push --all origin
          echo "== done =="
